<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" filter="url(#glow)" />
  
  <!-- Shield outline -->
  <path d="M256 96 C336 96 384 128 384 176 C384 288 256 384 256 384 C256 384 128 288 128 176 C128 128 176 96 256 96 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linejoin="round" />
        
  <!-- Heart Pulse Line inside shield -->
  <path d="M176 256 L216 256 L236 200 L256 304 L280 224 L296 256 L336 256" 
        fill="none" 
        stroke="#2563eb" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Small AI spark -->
  <circle cx="340" cy="160" r="14" fill="#38bdf8" />
</svg>
