services:
  db:
    image: postgres:16-alpine
    container_name: mediguard_db
    restart: always
    environment:
      POSTGRES_USER: mediguard_user
      POSTGRES_PASSWORD: mediguard_secure_password
      POSTGRES_DB: mediguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediguard_user -d mediguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediguard_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mediguard_user:mediguard_secure_password@db:5432/mediguard_db
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediguard_frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
